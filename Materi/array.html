<html lang="id">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Pembelajaran Array C++</title>
    <script src="https://cdn.tailwindcss.com"></script>

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
        
        @keyframes flashHighlight {
            0% { background-color: #4ade80; border-color: #16a34a; transform: scale(1.1); box-shadow: 0 0 15px rgba(34,197,94,0.6); }
            100% { background-color: #dbeafe; border-color: #3b82f6; transform: scale(1); }
        }
        .animate-flash { animation: flashHighlight 1s ease-out forwards; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f3f4f6; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans selection:bg-blue-200 selection:text-blue-900 min-h-screen flex flex-col">

                <div class="bg-blue-100 p-2 rounded-lg" id="logo-icon"></div>
                <h1 class="font-bold text-xl tracking-tight hidden sm:block">Array<span class="text-gray-400 font-light">C++</span></h1>
            </div>
            
            <nav class="flex bg-gray-100 p-1 rounded-xl">
                <button onclick="app.setTab('materi')" id="btn-tab-materi" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all bg-white text-blue-700 shadow-sm">
                    <span id="icon-materi"></span> <span class="hidden sm:inline">Materi</span>
                </button>

                    <span id="icon-simulasi"></span> <span class="hidden sm:inline">Simulasi</span>

                    <span id="icon-kuis"></span> <span class="hidden sm:inline">Kuis</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 w-full flex-grow relative">
        <!-- Area Materi -->
        <div id="section-materi" class="animate-fadeIn block"></div>

        <!-- Area Simulasi -->

            <div class="max-w-4xl mx-auto space-y-6">
                <!-- Mode Switcher -->

                        <button onclick="simulasi.setMode('misi')" id="btn-mode-misi" class="px-6 py-2 rounded-md font-medium text-sm transition-colors text-gray-500 hover:text-gray-700">Mode Misi</button>
                    </div>
                </div>

                    <div class="bg-gray-50 px-4 py-2 rounded-t-2xl flex justify-between items-center border-b border-gray-200">

                            <div class="w-3 h-3 rounded-full bg-red-400"></div>

                        <li>Dukung inisialisasi: <code class="bg-white px-1 rounded text-blue-600 font-bold">int nilai[3] = {1, 2, 3};</code></li>

        <!-- Area Kuis -->

    <script>

        document.getElementById('icon-refresh').innerHTML = ICONS.refresh;

        const materiSlides = [
            {
                title: "Konsep Array (Larik)",
                content: `
                    <div class="space-y-4 text-gray-700">
                        <p>Bayangkan kamu memiliki rak sepatu dengan banyak sekat. Setiap sekat hanya bisa diisi oleh satu pasang sepatu, dan sekat-sekat tersebut berjejer rapi serta diberi nomor urut.</p>
                        <p>Dalam pemrograman, <strong>Array (Larik)</strong> adalah struktur data yang mirip seperti rak sepatu tersebut. Array digunakan untuk menyimpan sekumpulan data yang memiliki <strong>tipe data yang sama</strong>, disimpan dalam blok memori yang berdekatan.</p>
                        <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                            <h4 class="font-semibold text-blue-800 mb-2">Karakteristik Array:</h4>
                            <ul class="list-disc pl-5 space-y-1">
                                <li>Semua elemen bertipe data sama (misal: semuanya integer).</li>
                                <li>Memiliki ukuran tetap (fixed size) setelah dideklarasikan.</li>
                                <li>Elemen diakses menggunakan <strong>Indeks</strong>, yang selalu dimulai dari <strong>0</strong>.</li>
                            </ul>
                        </div>
                    </div>`
            },
            {
                title: "Deklarasi Array dalam C++",
                content: `
                    <div class="space-y-4 text-gray-700">
                        <p>Untuk membuat array di C++, kita perlu memberi tahu komputer: tipe data, nama array, dan ukurannya (jumlah elemen).</p>
                        <div class="bg-blue-50 border border-blue-100 text-blue-800 p-4 rounded-lg font-mono text-sm overflow-x-auto">
                            tipe_data nama_array[ukuran];
                        </div>
                        <h4 class="font-semibold mt-4">Contoh:</h4>
                        <ul class="space-y-2">
                            <li><code class="bg-gray-100 border border-gray-200 px-2 py-1 rounded text-blue-700 font-bold">int nilai[5];</code> <br/>Membuat array 'nilai' yang bisa menyimpan 5 bilangan bulat.</li>
                            <li><code class="bg-gray-100 border border-gray-200 px-2 py-1 rounded text-blue-700 font-bold">string nama[10];</code> <br/>Membuat array 'nama' untuk 10 data teks (string).</li>
                            <li><code class="bg-gray-100 border border-gray-200 px-2 py-1 rounded text-blue-700 font-bold">int a[3] = {1, 2, 3};</code> <br/>Membuat array sekaligus mengisinya (inisialisasi).</li>
                        </ul>
                    </div>`
            },
            {
                title: "Alokasi Memori Array",
                content: `
                    <div class="space-y-4 text-gray-700">
                        <p>Berapa banyak ruang yang diambil array di memori komputer? Jawabannya bergantung pada tipe data dan jumlah elemen.</p>
                        <p class="font-semibold text-center bg-gray-100 py-2 rounded border border-gray-300">Total Memori = Ukuran Tipe Data × Jumlah Elemen</p>
                        
                        <div class="overflow-x-auto rounded-lg border border-gray-200 mt-4">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-blue-50 border-b-2 border-blue-200 text-blue-900">
                                        <th class="p-3">Tipe Data</th>
                                        <th class="p-3">Ukuran/Elemen</th>
                                        <th class="p-3">Contoh Deklarasi</th>
                                        <th class="p-3">Total Alokasi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="border-b"><td class="p-3 font-mono">int</td><td class="p-3">4 byte</td><td class="p-3 font-mono">int a[5];</td><td class="p-3">5 × 4 = <strong>20 byte</strong></td></tr>
                                    <tr class="border-b"><td class="p-3 font-mono">float</td><td class="p-3">4 byte</td><td class="p-3 font-mono">float b[10];</td><td class="p-3">10 × 4 = <strong>40 byte</strong></td></tr>
                                    <tr class="border-b"><td class="p-3 font-mono">double</td><td class="p-3">8 byte</td><td class="p-3 font-mono">double c[3];</td><td class="p-3">3 × 8 = <strong>24 byte</strong></td></tr>
                                    <tr class="border-b"><td class="p-3 font-mono">char</td><td class="p-3">1 byte</td><td class="p-3 font-mono">char d[8];</td><td class="p-3">8 × 1 = <strong>8 byte</strong></td></tr>
                                    <tr class="border-b"><td class="p-3 font-mono">bool</td><td class="p-3">1 byte</td><td class="p-3 font-mono">bool e[5];</td><td class="p-3">5 × 1 = <strong>5 byte</strong></td></tr>
                                    <tr class="bg-gray-50"><td class="p-3 font-mono">string</td><td class="p-3">~32 byte*</td><td class="p-3 font-mono">string f[3];</td><td class="p-3">3 × 32 = <strong>~96 byte</strong></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>`
            },
            {
                title: "Mengakses & Memanipulasi Array",
                content: `
                    <div class="space-y-4 text-gray-700">
                        <p>Kita menggunakan <strong>indeks</strong> (di dalam kurung siku <code>[]</code>) untuk menunjuk kotak tertentu. Ingat, indeks selalu mulai dari 0!</p>
                        
                        <h4 class="font-semibold text-blue-700 border-b pb-1">1. Memberi Nilai (Manipulasi)</h4>
                        <div class="bg-blue-50 border border-blue-100 text-gray-800 p-3 rounded-lg font-mono text-sm">
                            int nilai[3];<br/>
                            <span class="text-green-700 font-semibold">nilai[0] = 75;</span> // Mengisi kotak pertama<br/>
                            <span class="text-green-700 font-semibold">nilai[2] = nilai[0] + 5;</span> // Kotak ketiga = 75 + 5 = 80
                        </div>

                        <h4 class="font-semibold text-blue-700 border-b pb-1 mt-4">2. Membaca/Menampilkan & Input Data</h4>
                        <div class="bg-blue-50 border border-blue-100 text-gray-800 p-3 rounded-lg font-mono text-sm">
                            // Menampilkan isi indeks ke-0<br/>
                            <span class="text-blue-700 font-semibold">cout &lt;&lt; nilai[0];</span> <br/><br/>
                            // Meminta user mengetik angka, lalu disimpan di indeks ke-0<br/>
                            <span class="text-orange-600 font-semibold">cin &gt;&gt; nilai[0];</span>
                        </div>
                    </div>`
            },
            {
                title: "Bahaya: Index Out of Bounds",
                content: `
                    <div class="space-y-4 text-gray-700">
                        <p>Dalam C++, tidak ada pemeriksaan otomatis apakah indeks yang kamu panggil itu ada atau tidak. Jika kamu membuat array berisi 5 elemen (indeks 0 sampai 4), lalu kamu mencoba mengisi indeks ke-10, program <strong>mungkin tidak error saat dikompilasi</strong>, tetapi akan kacau saat dijalankan!</p>
                        <div class="bg-red-50 p-4 rounded-lg border border-red-200 shadow-sm">
                            <h4 class="font-semibold text-red-800 mb-2">Contoh Error:</h4>
                            <div class="bg-red-100 border border-red-200 text-gray-800 p-3 rounded-lg font-mono text-sm mb-2">
                                int data[3]; // Indeks valid: 0, 1, 2 <br/>
                                <span class="text-red-700 font-semibold">data[5] = 100;</span> // ❌ INDEX OUT OF BOUNDS!
                            </div>
                            <p class="text-sm text-red-900">Perilaku ini akan menimpa memori program lain dan menyebabkan aplikasi <em>crash</em>. Simulator kita sudah dilengkapi pencegah error ini untuk melatih kedisiplinanmu!</p>
                        </div>
                    </div>`
            }
        ];

        const parser = {
            evaluateExpr(exprStr, type) {
                let s = exprStr.trim();
                // Keamanan sederhana mencegah eksekusi DOM di sisi client
                if (s.match(/window|document|alert|console|eval|setTimeout/i)) {
                    throw new Error("Sintaks tidak diizinkan.");
                }
                try { 
                    // Menggunakan Function untuk menghitung matematika & penggabungan string yang aman
                    let res = Function(`'use strict'; return (${s})`)(); 
                    if (type === 'int') return Math.trunc(res); // Potong desimal untuk int
                    if (type === 'float' || type === 'double') return Number(res);
                    if (type === 'string') return String(res);
                    if (type === 'char') return String(res).charAt(0);
                    return res;
                } 
                catch (e) { 
                    throw new Error("Gagal menghitung. Pastikan ekspresi valid (gunakan kutip untuk teks string)."); 
                }
            },

            resolveExpression(exprStr, ObjectStates, expectedType = 'int') {
                let s = exprStr.trim();
                const accessRegex = /([a-zA-Z_]\w*)\[([^\[\]]+)\]/;
                let match;
                let safety = 0;
                
                while ((match = accessRegex.exec(s)) !== null && safety < 50) {
                    const arrName = match[1];
                    const innerExpr = match[2];
                    
                    if (!ObjectStates[arrName]) throw new Error(`Array '${arrName}' belum dideklarasikan.`);
                    
                    let indexVal;
                    try { indexVal = this.evaluateExpr(innerExpr, 'int'); } 
                    catch (e) { throw new Error(`Gagal menghitung indeks: [${innerExpr}]`); }

                    if (!Number.isInteger(indexVal)) throw new Error(`Indeks harus bilangan bulat, didapat: ${indexVal}`);
                    if (indexVal < 0 || indexVal >= ObjectStates[arrName].size) throw new Error(`Indeks ${indexVal} di luar batas array '${arrName}' (0 - ${ObjectStates[arrName].size - 1}).`);
                    
                    const val = ObjectStates[arrName].data[indexVal];
                    // Bungkus dengan tanda kutip jika tipe datanya string/char agar bisa digabungkan dengan +
                    let replacedVal = (ObjectStates[arrName].type === 'string' || ObjectStates[arrName].type === 'char') ? `"${val}"` : val;
                    s = s.replace(match[0], replacedVal);
                    safety++;
                }
                if (safety >= 50) throw new Error("Terlalu banyak array bersarang (nested) atau loop.");
                
                return this.evaluateExpr(s, expectedType);
            },

            execute(command, ObjectStates, options = { allowRedeclare: false, mode: 'custom' }) {
                let cmd = command.trim();
                if (!cmd.endsWith(';')) return { error: "Sintaks salah: Jangan lupa titik koma (;) di akhir." };
                cmd = cmd.slice(0, -1).trim(); 

                const declRegex = /^(int|float|double|char|string|bool)\s+([a-zA-Z_]\w*)\s*\[\s*(\d+)\s*\](?:\s*=\s*\{\s*([^}]+)\s*\})?$/;
                const declMatch = cmd.match(declRegex);
                
                if (declMatch) {
                    const type = declMatch[1];
                    const arrName = declMatch[2];
                    const size = parseInt(declMatch[3]);
                    
                    if (ObjectStates[arrName] && !options.allowRedeclare) return { error: `Array '${arrName}' sudah ada.` };
                    if (Object.keys(ObjectStates).length >= 2 && !ObjectStates[arrName] && options.mode === 'custom') {
                        return { error: "Maksimal 2 array yang dapat dibuat dalam Mode Custom. Silakan klik tombol Reset untuk mengulang." };
                    }
                    if (size <= 0 || size > 15) return { error: "Ukuran array harus antara 1 - 15." };
                    
                    let defaultVal = (type === 'string' || type === 'char') ? "" : 0;
                    let initialData = Array(size).fill(defaultVal);

                    if (declMatch[4]) {
                        try {
                            const rawVals = declMatch[4].split(',').map(s => s.trim());
                            let vals = [];
                            for(let i=0; i<rawVals.length; i++) vals.push(this.evaluateExpr(rawVals[i], type));
                            if (vals.length > size) throw new Error("Jumlah data inisialisasi melebihi ukuran array.");
                            vals.forEach((v, i) => initialData[i] = v); 
                        } catch (e) {
                            return { error: `Gagal inisialisasi: ${e.message}` };
                        }
                    }

                    const newArrayData = { type: type, name: arrName, size: size, data: initialData };
                    return {
                        newStates: { ...ObjectStates, [arrName]: newArrayData },
                        log: `Berhasil membuat array '${arrName}' berukuran ${size}${declMatch[4] ? ' beserta inisialisasi awalnya.' : '.'}`
                    };
                }

                if (Object.keys(ObjectStates).length === 0) return { error: "Deklarasikan array terlebih dahulu! (misal: int nilai[5];)" };

                if (cmd.startsWith("cout")) {
                    const outRegex = /^cout\s*<<\s*(.+)$/;
                    const outMatch = cmd.match(outRegex);
                    if (outMatch) {
                        try {
                            // Mencari tipe data untuk cout (ambil dari array pertama yang ada, atau anggap int jika kosong)
                            const outputType = Object.values(ObjectStates).length > 0 ? Object.values(ObjectStates)[0].type : 'int';
                            const result = this.resolveExpression(outMatch[1], ObjectStates, outputType);
                            return { log: `> Output: ${result}`, output: result };
                        } catch (err) { return { error: err.message }; }
                    } else { return { error: "Sintaks cout salah. Gunakan: cout << ekspresi;" }; }
                }

                const eqIndex = cmd.indexOf('=');
                if (eqIndex > -1) {
                    const lhs = cmd.substring(0, eqIndex).trim();
                    const rhs = cmd.substring(eqIndex + 1).trim();
                    const lhsMatch = lhs.match(/^([a-zA-Z_]\w*)\[(.+)\]$/);

                    if (lhsMatch) {
                        const arrName = lhsMatch[1];
                        const indexExpr = lhsMatch[2];
                        
                        if (!ObjectStates[arrName]) return { error: `Array '${arrName}' tidak ditemukan.` };

                        try {
                            const targetIndex = this.resolveExpression(indexExpr, ObjectStates, 'int');
                            if (!Number.isInteger(targetIndex)) throw new Error(`Indeks tujuan bukan integer.`);
                            if (targetIndex < 0 || targetIndex >= ObjectStates[arrName].size) throw new Error(`Indeks ${targetIndex} di luar batas array '${arrName}'. Out of Bounds!`);

                            const valueToAssign = this.resolveExpression(rhs, ObjectStates, ObjectStates[arrName].type);
                            const newData = [...ObjectStates[arrName].data];
                            newData[targetIndex] = valueToAssign;

                            const newStates = { ...ObjectStates, [arrName]: { ...ObjectStates[arrName], data: newData } };
                            
                            return {
                                newStates: newStates,
                                log: `[Update] ${arrName}[${targetIndex}] diisi nilai ${valueToAssign}`,
                                modifiedArray: arrName,
                                modifiedIndex: targetIndex
                            };
                        } catch (err) { return { error: err.message }; }
                    } else { return { error: `Sintaks penugasan salah. Pastikan format: nama_array[indeks] = ekspresi;` }; }
                }
                return { error: "Perintah tidak dikenali. Gunakan deklarasi, penugasan (=), atau cout." };
            }
        };

        const missionGenerator = {
            generate() {
                const types = ['int', 'float', 'string'];
                const selectedType = types[Math.floor(Math.random() * types.length)];
                const size = Math.floor(Math.random() * 3) + 6; 
                
                const idxA = 0;
                const idxB = 1;
                const idxC = 2;
                const idxD = 3;

                let missions = [];

                if (selectedType === 'int') {
                    const themes = [
                        { name: 'umur', desc: 'data umur siswa' },
                        { name: 'skor', desc: 'poin permainan' },
                        { name: 'stok', desc: 'jumlah stok barang' }
                    ];
                    const t = themes[Math.floor(Math.random() * themes.length)];
                    const arr = t.name;
                    const valA = idxB; // Kunci validasi untuk Nested M6
                    const valB = Math.floor(Math.random() * 20) + 10; 
                    
                    const ops = ['+', '-', '*'];
                    const op = ops[Math.floor(Math.random() * ops.length)];
                    const opWord = op === '+' ? 'ditambah' : op === '-' ? 'dikurangi' : 'dikali';
                    const resultM4 = op === '+' ? (valA + valB) : op === '-' ? (valA - valB) : (valA * valB);

                    missions = [
                        {
                            text: `Misi 1: Deklarasikan sebuah array bernama '${arr}' untuk menampung ${size} buah ${t.desc}. (Tipe data bilangan bulat)`,
                            hint: `tipe_data nama_array[ukuran];`,
                            check: (cmd, res) => res.newStates && res.newStates[arr] && res.newStates[arr].size === size && res.newStates[arr].type === 'int',
                            allowRedeclare: true
                        },
                        {
                            text: `Misi 2: Isi array '${arr}' pada indeks ke ${idxA} dengan angka ${valA};`,
                            hint: `nama_array[indeks] = nilai;`,
                            check: (cmd, res) => res.newStates && res.newStates[arr] && res.newStates[arr].data[idxA] === valA
                        },
                        {
                            text: `Misi 3: Isi array '${arr}' pada indeks ke ${idxB} dengan angka ${valB};`,
                            hint: `nama_array[indeks] = nilai;`,
                            check: (cmd, res) => res.newStates && res.newStates[arr] && res.newStates[arr].data[idxB] === valB
                        },
                        {
                            text: `Misi 4: Isi array '${arr}' pada indeks ke ${idxC} dengan hasil dari indeks ke ${idxA} ${opWord} indeks ke ${idxB}.`,
                            hint: `nama_array[tujuan] = nama_array[sumber1] ${op} nama_array[sumber2];`,
                            check: (cmd, res) => res.newStates && res.newStates[arr] && res.newStates[arr].data[idxC] === resultM4 && cmd.includes(op) && cmd.includes(`${arr}[${idxA}]`) && cmd.includes(`${arr}[${idxB}]`)
                        },
                        {
                            text: `Misi 5: Tampilkan (output) isi array '${arr}' indeks ke ${idxC} menggunakan perintah cout.`,
                            hint: `cout << nama_array[indeks];`,
                            check: (cmd, res) => res.output !== undefined && res.output === resultM4 && cmd.includes('cout') && cmd.includes(`[${idxC}]`)
                        },
                        {
                            text: `Misi 6: (Tantangan Bersarang) Isi array '${arr}' pada indeks ke ${idxD} dengan nilai dari array indeks yang ditunjuk oleh indeks ke ${idxA}.`,
                            hint: `nama_array[tujuan] = nama_array[nama_array[sumber]];`,
                            check: (cmd, res) => res.newStates && res.newStates[arr] && res.newStates[arr].data[idxD] === valB && cmd.replace(/\s/g,'').includes(`${arr}[${arr}[${idxA}]]`)
                        },
                        {
                            text: `Misi 7: Tampilkan hasil perhitungan indeks ke ${idxB} ditambah indeks ke ${idxD}.`,
                            hint: `cout << nama_array[idxA] + nama_array[idxB];`,
                            check: (cmd, res) => res.output !== undefined && res.output === (valB + valB) && cmd.includes('+')
                        }
                    ];
                } 
                else if (selectedType === 'float') {
                    const themes = [
                        { name: 'suhu', desc: 'suhu badan' },
                        { name: 'berat', desc: 'berat badan (kg)' },
                        { name: 'jarak', desc: 'jarak tempuh (km)' }
                    ];
                    const t = themes[Math.floor(Math.random() * themes.length)];
                    const arr = t.name;
                    const valA = parseFloat((Math.random() * 10 + 20).toFixed(1)); 
                    const valB = parseFloat((Math.random() * 10 + 10).toFixed(1)); 
                    
                    const ops = ['+', '-', '*'];
                    const op = ops[Math.floor(Math.random() * ops.length)];
                    const opWord = op === '+' ? 'ditambah' : op === '-' ? 'dikurangi' : 'dikali';
                    const resultM4 = op === '+' ? (valA + valB) : op === '-' ? (valA - valB) : (valA * valB);
                    const resultM6 = valA / 2; // Hitungan khusus Misi 6 float

                    missions = [
                        {
                            text: `Misi 1: Deklarasikan array bernama '${arr}' untuk menampung ${size} buah data ${t.desc}. (Tipe data bilangan desimal / float)`,
                            hint: `tipe_data nama_array[ukuran];`,
                            check: (cmd, res) => res.newStates && res.newStates[arr] && res.newStates[arr].size === size && res.newStates[arr].type === 'float',
                            allowRedeclare: true
                        },
                        {
                            text: `Misi 2: Isi array '${arr}' pada indeks ke ${idxA} dengan angka ${valA};`,
                            hint: `nama_array[indeks] = nilai;`,
                            check: (cmd, res) => res.newStates && res.newStates[arr] && Math.abs(res.newStates[arr].data[idxA] - valA) < 0.001
                        },
                        {
                            text: `Misi 3: Isi array '${arr}' pada indeks ke ${idxB} dengan angka ${valB};`,
                            hint: `nama_array[indeks] = nilai;`,
                            check: (cmd, res) => res.newStates && res.newStates[arr] && Math.abs(res.newStates[arr].data[idxB] - valB) < 0.001
                        },
                        {
                            text: `Misi 4: Isi array '${arr}' pada indeks ke ${idxC} dengan hasil dari indeks ke ${idxA} ${opWord} indeks ke ${idxB}.`,
                            hint: `nama_array[tujuan] = nama_array[sumber1] ${op} nama_array[sumber2];`,
                            check: (cmd, res) => res.newStates && res.newStates[arr] && Math.abs(res.newStates[arr].data[idxC] - resultM4) < 0.001 && cmd.includes(op) && cmd.includes(`${arr}[${idxA}]`) && cmd.includes(`${arr}[${idxB}]`)
                        },
                        {
                            text: `Misi 5: Tampilkan (output) isi array '${arr}' indeks ke ${idxC} menggunakan perintah cout.`,
                            hint: `cout << nama_array[indeks];`,
                            check: (cmd, res) => res.output !== undefined && Math.abs(res.output - resultM4) < 0.001 && cmd.includes('cout') && cmd.includes(`[${idxC}]`)
                        },
                        {
                            text: `Misi 6: (Kalkulasi) Isi array '${arr}' pada indeks ke ${idxD} dengan nilai dari indeks ke ${idxA} dibagi 2.`,
                            hint: `nama_array[tujuan] = nama_array[sumber] / 2;`,
                            check: (cmd, res) => res.newStates && res.newStates[arr] && Math.abs(res.newStates[arr].data[idxD] - resultM6) < 0.001 && cmd.includes('/')
                        },
                        {
                            text: `Misi 7: Tampilkan hasil perhitungan indeks ke ${idxC} ditambah indeks ke ${idxD}.`,
                            hint: `cout << nama_array[idxA] + nama_array[idxB];`,
                            check: (cmd, res) => res.output !== undefined && Math.abs(res.output - (resultM4 + resultM6)) < 0.001 && cmd.includes('+')
                        }
                    ];
                } 
                else { // Skenario String
                    const themes = [
                        { name: 'nama', desc: 'nama siswa' },
                        { name: 'kota', desc: 'nama kota' },
                        { name: 'mapel', desc: 'mata pelajaran' }
                    ];
                    const t = themes[Math.floor(Math.random() * themes.length)];
                    const arr = t.name;
                    
                    let valA, valB, staticText;
                    if(arr === 'nama') { valA = "Andi"; valB = "Budi"; staticText = "Juara"; }
                    else if(arr === 'kota') { valA = "Solo"; valB = "Bali"; staticText = "Indah"; }
                    else { valA = "Fisika"; valB = "Kimia"; staticText = "Seru"; }

                    missions = [
                        {
                            text: `Misi 1: Deklarasikan array bernama '${arr}' untuk menampung ${size} data ${t.desc}. (Tipe data teks / string)`,
                            hint: `tipe_data nama_array[ukuran];`,
                            check: (cmd, res) => res.newStates && res.newStates[arr] && res.newStates[arr].size === size && res.newStates[arr].type === 'string',
                            allowRedeclare: true
                        },
                        {
                            text: `Misi 2: Isi array '${arr}' pada indeks ke ${idxA} dengan teks "${valA}";`,
                            hint: `nama_array[indeks] = "Teks"; (Ingat tanda kutip!)`,
                            check: (cmd, res) => res.newStates && res.newStates[arr] && res.newStates[arr].data[idxA] === valA
                        },
                        {
                            text: `Misi 3: Isi array '${arr}' pada indeks ke ${idxB} dengan teks "${valB}";`,
                            hint: `nama_array[indeks] = "Teks";`,
                            check: (cmd, res) => res.newStates && res.newStates[arr] && res.newStates[arr].data[idxB] === valB
                        },
                        {
                            text: `Misi 4: Salin (Copy) isi dari indeks ke ${idxA} untuk dimasukkan ke dalam indeks ke ${idxC}.`,
                            hint: `nama_array[tujuan] = nama_array[sumber];`,
                            check: (cmd, res) => res.newStates && res.newStates[arr] && res.newStates[arr].data[idxC] === valA && cmd.includes(`${arr}[${idxA}]`)
                        },
                        {
                            text: `Misi 5: Tampilkan (output) isi array '${arr}' indeks ke ${idxC} menggunakan perintah cout.`,
                            hint: `cout << nama_array[indeks];`,
                            check: (cmd, res) => res.output !== undefined && res.output === valA && cmd.includes('cout') && cmd.includes(`[${idxC}]`)
                        },
                        {
                            text: `Misi 6: (Penggabungan String) Gabungkan isi dari indeks ke ${idxA} dan indeks ke ${idxB} (gunakan tanda +), simpan hasilnya ke indeks ke ${idxD}.`,
                            hint: `nama_array[tujuan] = nama_array[sumber1] + nama_array[sumber2];`,
                            check: (cmd, res) => res.newStates && res.newStates[arr] && res.newStates[arr].data[idxD] === (valA + valB) && cmd.includes('+')
                        },
                        {
                            text: `Misi 7: Tampilkan gabungan dari indeks ke ${idxD} ditambah teks statis "${staticText}".`,
                            hint: `cout << nama_array[indeks] + "TeksStatis";`,
                            check: (cmd, res) => res.output !== undefined && res.output === (valA + valB + staticText) && cmd.includes('+') && cmd.includes(`"${staticText}"`)
                        }
                    ];
                }

                return missions;
            }
        };

        const simulasi = {
            mode: 'custom',
            states: {},
            logs: [{ type: 'info', text: "Selamat datang! Ketik perintah bebas." }],
            missions: [],
            missionIdx: 0,
            complete: false,
            lastModified: { arrName: null, index: null },
            showHint: false,

            init() {
                this.missions = missionGenerator.generate();
                document.getElementById('terminal-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleCommand();
                });
                this.renderAll();
            },

            setMode(newMode) {
                this.mode = newMode;
                this.states = {};
                this.complete = false;
                this.lastModified = { arrName: null, index: null };
                this.showHint = false;
                if (newMode === 'misi') {
                    this.missionIdx = 0;
                    this.missions = missionGenerator.generate();
                    this.logs = [{ type: 'info', text: `✨ Mode Misi aktif! Mulai dari Misi 1.` }];
                    document.getElementById('btn-mode-misi').className = "px-6 py-2 rounded-md font-medium text-sm transition-colors bg-blue-600 text-white shadow";
                    document.getElementById('btn-mode-custom').className = "px-6 py-2 rounded-md font-medium text-sm transition-colors text-gray-500 hover:text-gray-700";
                    document.getElementById('mission-card').classList.remove('hidden');
                    document.getElementById('custom-helper').classList.add('hidden');
                } else {
                    this.logs = [{ type: 'info', text: "🔧 Mode Custom aktif! Bebas bereksperimen, maksimal 2 Array." }];
                    document.getElementById('btn-mode-custom').className = "px-6 py-2 rounded-md font-medium text-sm transition-colors bg-blue-600 text-white shadow";
                    document.getElementById('btn-mode-misi').className = "px-6 py-2 rounded-md font-medium text-sm transition-colors text-gray-500 hover:text-gray-700";
                    document.getElementById('mission-card').classList.add('hidden');
                    document.getElementById('custom-helper').classList.remove('hidden');
                }
                this.renderAll();
            },

            restartMissions() {
                this.missionIdx = 0;
                this.complete = false;
                this.states = {}; 
                this.lastModified = { arrName: null, index: null };
                this.showHint = false;
                this.missions = missionGenerator.generate();
                this.logs = [{ type: 'info', text: "✨ Simulasi direset! Skenario misi baru telah dibuat." }];
                
                const inputEl = document.getElementById('terminal-input');
                const submitBtn = document.getElementById('terminal-submit');
                inputEl.disabled = false;
                submitBtn.disabled = false;
                inputEl.value = '';
                
                this.renderAll();
            },

            reset() {
                this.states = {};
                this.lastModified = { arrName: null, index: null };
                this.logs = [{ type: 'info', text: "Simulator direset. Mulai dari awal." }];
                if(this.mode === 'misi') this.restartMissions();
                else this.renderAll();
            },

            handleCommand() {
                const inputEl = document.getElementById('terminal-input');
                const cmd = inputEl.value;
                if (!cmd.trim()) return;

                this.logs.push({ type: 'cmd', text: cmd });
                inputEl.value = '';
                this.lastModified = { arrName: null, index: null };

                let currentMisi = null;
                let allowRedeclare = false;
                
                if (this.mode === 'misi' && !this.complete) {
                    currentMisi = this.missions[this.missionIdx];
                    allowRedeclare = !!currentMisi.allowRedeclare;
                }

                const result = parser.execute(cmd, this.states, { allowRedeclare: allowRedeclare, mode: this.mode });

                if (result.error) {
                    this.logs.push({ type: 'error', text: result.error });
                } else {
                    if (this.mode === 'misi' && currentMisi) {
                        if (currentMisi.check(cmd, result)) {
                            if (result.newStates) this.states = result.newStates;
                            if (result.modifiedIndex !== undefined) this.lastModified = { arrName: result.modifiedArray, index: result.modifiedIndex };
                            if (result.log) this.logs.push({ type: 'success', text: result.log });
                            
                            this.logs.push({ type: 'success', text: `✨ Misi ${this.missionIdx + 1} Selesai!` });
                            this.showHint = false;
                            
                            if (this.missionIdx + 1 < this.missions.length) {
                                this.missionIdx++;
                            } else {
                                this.complete = true;
                                this.logs.push({ type: 'success', text: `🎉 SELAMAT! Semua misi diselesaikan!` });
                            }
                        } else {
                            this.logs.push({ type: 'error', text: `❌ Ditolak: Perintah valid secara sintaks, namun belum menjawab tujuan Misi ${this.missionIdx + 1}.` });
                        }
                    } else {
                        if (result.newStates) this.states = result.newStates;
                        if (result.modifiedIndex !== undefined) this.lastModified = { arrName: result.modifiedArray, index: result.modifiedIndex };
                        if (result.log) this.logs.push({ type: 'success', text: result.log });
                    }
                }
                this.renderAll();
            },

            toggleHint() {
                this.showHint = !this.showHint;
                this.renderMissionCard();
            },

            renderAll() {
                this.renderMissionCard();
                this.renderVisualizer();
                this.renderLogs();
                
                const inputEl = document.getElementById('terminal-input');
                const submitBtn = document.getElementById('terminal-submit');
                if (this.mode === 'misi' && this.complete) {
                    inputEl.disabled = true;
                    submitBtn.disabled = true;
                    inputEl.placeholder = "Semua misi selesai!";
                } else {
                    inputEl.disabled = false;
                    submitBtn.disabled = false;
                    inputEl.placeholder = "Ketik sintaks di sini lalu tekan Enter...";
                    inputEl.focus();
                }
            },

            renderMissionCard() {
                const card = document.getElementById('mission-card');
                if (this.mode !== 'misi') return;

                if (this.complete) {
                    card.innerHTML = `
                        <div class="text-center animate-fadeIn py-2">
                            <h3 class="text-3xl font-bold mb-2">🎉 Luar Biasa!</h3>
                            <p class="text-blue-100 mb-6">Kamu telah berhasil menyelesaikan ke-7 tantangan array.</p>
                            <button onclick="simulasi.restartMissions()" class="bg-white text-blue-800 px-6 py-3 rounded-xl font-bold shadow-sm hover:bg-blue-50 transition-colors">
                                Ulangi dengan Misi Berbeda
                            </button>
                        </div>`;
                } else {
                    const m = this.missions[this.missionIdx];
                    card.innerHTML = `
                        <div class="animate-fadeIn">
                            <div class="flex justify-between items-center mb-3">
                                <span class="bg-blue-900/60 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide border border-blue-500/30">Misi ${this.missionIdx + 1} / 7</span>
                                <div class="flex gap-2">
                                    <button onclick="simulasi.restartMissions()" title="Reset Misi dari awal" class="text-xs bg-red-500/20 hover:bg-red-500/40 text-red-100 px-3 py-1 rounded-md transition-colors flex items-center gap-1 font-medium border border-red-500/30">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg> Reset
                                    </button>
                                    <button onclick="simulasi.toggleHint()" class="text-xs font-medium text-blue-200 hover:text-white flex items-center transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                                        ${this.showHint ? 'Tutup Konsep' : 'Buka Konsep'}
                                    </button>
                                </div>
                            </div>
                            <h3 class="text-lg font-medium leading-relaxed mb-4">${m.text}</h3>
                            <div class="${this.showHint ? 'block animate-fadeIn' : 'hidden'} mt-3 bg-blue-900/40 p-3 rounded-xl border border-blue-500/30 text-sm">
                                <span class="text-blue-300 block mb-1 text-xs uppercase tracking-wider font-bold">💡 Konsep:</span>
                                <code class="font-mono text-green-300 whitespace-pre-wrap">${m.hint}</code>
                            </div>
                        </div>`;
                }
            },

            renderVisualizer() {
                const area = document.getElementById('visualizer-area');
                const stateKeys = Object.keys(this.states);

                if (stateKeys.length === 0) {
                    area.innerHTML = `
                        <div class="text-gray-400 text-center animate-fadeIn">
                            <div class="text-4xl mb-2">📦</div>
                            <p>Array belum dibuat.<br/>Ketik deklarasi di terminal bawah.</p>
                        </div>`;
                    return;
                }

                let html = `<div class="w-full animate-fadeIn flex flex-col gap-6">`;

                stateKeys.forEach(key => {
                    const arr = this.states[key];
                    let boxesHTML = arr.data.map((val, idx) => {
                        const isHighlighted = (this.lastModified.arrName === key && this.lastModified.index === idx);
                        const baseStyle = 'bg-blue-100 border-blue-500 text-blue-900';
                        const animStyle = isHighlighted ? 'animate-flash' : '';
                        let displayVal = val;
                        
                        if (arr.type === 'string') displayVal = `"${val}"`;
                        else if (arr.type === 'char') displayVal = `'${val}'`;
                        
                        return `
                        <div class="flex flex-col items-center">
                            <div class="min-w-[4rem] w-fit px-3 h-16 border-2 flex items-center justify-center text-xl font-bold rounded-lg shadow-sm transition-all duration-300 ${baseStyle} ${animStyle}">
                                ${displayVal}

                            <div class="mt-2 text-sm font-mono text-gray-500 bg-gray-50 border border-gray-200 px-2 rounded">[${idx}]</div>

                    }).join('');

                    html += `
                        <div>

                                ${boxesHTML}

                });

                html += `</div>`;
                area.innerHTML = html;

            renderLogs() {
                const logsContainer = document.getElementById('terminal-logs');
                logsContainer.innerHTML = this.logs.map(l => {
                    let color = '';
                    if (l.type === 'cmd') color = 'text-gray-800 font-bold';
                    if (l.type === 'error') color = 'text-red-600';
                    if (l.type === 'success') color = 'text-green-600';
                    if (l.type === 'info') color = 'text-blue-600';

                logsContainer.scrollTop = logsContainer.scrollHeight;
            }
        };

        const kuisGenerator = {
            generate() {
                const questions = [];
                const types = [{ name: 'int', size: 4 }, { name: 'float', size: 4 }, { name: 'double', size: 8 }];
                const t1 = types[Math.floor(Math.random() * types.length)];
                const size1 = Math.floor(Math.random() * 10) + 5;
                const ans1 = t1.size * size1;
                questions.push({
                    code: `${t1.name} data[${size1}];`,
                    question: `Berapa alokasi memori pada array data tersebut dalam hitungan byte?`,
                    options: [ans1.toString(), (ans1 + t1.size).toString(), (size1).toString(), (ans1 / 2).toString()].sort(() => Math.random() - 0.5),
                    answer: ans1.toString(),
                    feedback: `Tipe data <code>${t1.name}</code> membutuhkan ${t1.size} byte per elemen. Karena ada ${size1} elemen, maka ${t1.size} x ${size1} = <strong>${ans1} byte</strong>.`
                });

                const namesPool = ["Siti", "Abdul", "Kevin", "Laura", "Daniel", "Salsa", "Budi", "Andi", "Lala", "Doni"];
                const shuffledNames = [...namesPool].sort(() => Math.random() - 0.5).slice(0, 6);
                const targetIndex2 = Math.floor(Math.random() * 6);
                const ans2 = shuffledNames[targetIndex2];
                questions.push({
                    code: `string nama[6] = {"${shuffledNames.join('", "')}"};`,
                    question: `Elemen nama[${targetIndex2}] berisi teks (string) apa?`,
                    options: [ans2, shuffledNames[(targetIndex2+1)%6], shuffledNames[(targetIndex2+2)%6], shuffledNames[(targetIndex2+3)%6]].sort(() => Math.random() - 0.5),
                    answer: ans2,
                    feedback: `Indeks array selalu dimulai dari <strong>0</strong>. Urutan indeks ke-${targetIndex2} jatuh pada teks <strong>"${ans2}"</strong>.`
                });

                const val3 = Array.from({length: 6}, () => Math.floor(Math.random() * 50) + 20);
                const targetIndex3 = Math.floor(Math.random() * 6);
                const targetValue3 = val3[targetIndex3];
                questions.push({
                    code: `int bb[6] = {${val3.join(',')}};`,
                    question: `Sintaks apa yang harus ditulis untuk menampilkan data angka ${targetValue3}?`,
                    options: [`cout << bb[${targetIndex3}];`, `cout << bb[${targetIndex3+1}];`, `bb[${targetIndex3}];`, `cin >> bb[${targetIndex3}];`].sort(() => Math.random() - 0.5),
                    answer: `cout << bb[${targetIndex3}];`,
                    feedback: `Untuk menampilkan output ke layar, kita harus menggunakan perintah <code>cout &lt;&lt;</code>. Angka ${targetValue3} berada di urutan ke-${targetIndex3 + 1}, yang berarti indeksnya adalah <strong>${targetIndex3}</strong>.`
                });

                let val4 = [0, 1, 2, 3, 4, 5].sort(() => Math.random() - 0.5);
                const startIdx4 = Math.floor(Math.random() * 6);
                const l1 = val4[startIdx4];
                const l2 = val4[l1];
                const ans4 = val4[l2];
                questions.push({
                    code: `int array[6] = {${val4.join(',')}};`,
                    question: `Apa output dari kode program cout << array[array[array[${startIdx4}]]]; ?`,
                    options: [ans4.toString(), val4[startIdx4].toString(), l1.toString(), l2.toString()].filter((v,i,a)=>a.indexOf(v)===i).concat(["-1","10","0"]).slice(0,4).sort(() => Math.random() - 0.5),
                    answer: ans4.toString(),
                    feedback: `Selesaikan dari dalam: array[${startIdx4}] = ${l1}. Lalu array[${l1}] = ${l2}. Terakhir array[${l2}] menghasilkan <strong>${ans4}</strong>.`
                });

                const val5 = Array.from({length: 6}, () => Math.floor(Math.random() * 10) + 1);
                const i5_1 = Math.floor(Math.random() * 6);
                let i5_2 = Math.floor(Math.random() * 6);
                while(i5_1 === i5_2) i5_2 = Math.floor(Math.random() * 6);
                const ans5 = val5[i5_1] + val5[i5_2];
                questions.push({
                    code: `int array[6] = {${val5.join(',')}};`,
                    question: `Apa output dari kode program cout << array[${i5_1}] + array[${i5_2}]; ?`,
                    options: [ans5.toString(), (ans5+1).toString(), (ans5-1).toString(), (val5[i5_1]*val5[i5_2]).toString()].sort(() => Math.random() - 0.5),
                    answer: ans5.toString(),
                    feedback: `Nilai array[${i5_1}] adalah ${val5[i5_1]}. Nilai array[${i5_2}] adalah ${val5[i5_2]}. Jumlahnya: ${val5[i5_1]} + ${val5[i5_2]} = <strong>${ans5}</strong>.`
                });
                return questions;
            }
        };

        const kuis = {
            questions: [],
            currentIdx: 0,
            score: 0,
            showResult: false,
            selectedOpt: null,
            isAnswered: false,
            highScore: 0,

            init() {
                const savedScore = localStorage.getItem('array_cpp_highscore');
                if (savedScore !== null) this.highScore = parseInt(savedScore);
                this.questions = kuisGenerator.generate();
                this.render();
            },

            handleAnswer(opt) {
                if (this.isAnswered) return;
                this.selectedOpt = opt;
                this.isAnswered = true;
                
                if (opt === this.questions[this.currentIdx].answer) {
                    this.score += 20;
                }

                this.render(); 
            },

            lanjutSoal() {
                if (this.currentIdx + 1 < this.questions.length) {
                    this.currentIdx++;
                    this.selectedOpt = null;
                    this.isAnswered = false;
                } else {
                    this.showResult = true;
                    if (this.score > this.highScore) {
                        this.highScore = this.score;
                        localStorage.setItem('array_cpp_highscore', this.highScore);
                    }
                }
                this.render();
            },

            restart() {
                this.questions = kuisGenerator.generate();
                this.currentIdx = 0;
                this.score = 0;
                this.showResult = false;
                this.selectedOpt = null;
                this.isAnswered = false;
                this.render();
            },

            render() {
                const container = document.getElementById('section-kuis');
                
                if (this.showResult) {
                    const isNewHighScore = this.score === this.highScore && this.score > 0;
                    container.innerHTML = `
                        <div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-sm text-center border border-gray-100 animate-fadeIn">
                            <div class="text-6xl mb-4">${this.score >= 80 ? '🎉' : this.score >= 60 ? '👍' : '📚'}</div>
                            <h2 class="text-3xl font-bold mb-2">Kuis Selesai!</h2>
                            <p class="text-gray-600 mb-2">Nilai kamu adalah:</p>
                            <div class="text-6xl font-black mb-4 ${this.score >= 80 ? 'text-green-500' : this.score >= 60 ? 'text-blue-500' : 'text-red-500'}">
                                ${this.score}
                            </div>
                            ${isNewHighScore ? `<div class="inline-block bg-yellow-100 text-yellow-800 px-4 py-1 rounded-full text-sm font-bold mb-6">🏆 Rekor Tertinggi Baru!</div>` : `<div class="text-gray-500 text-sm mb-6">Skor Tertinggi saat ini: ${this.highScore}</div>`}
                            <br/>
                            <button onclick="kuis.restart()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-8 rounded-xl transition-all shadow-md hover:shadow-lg">
                                Coba Lagi dengan Soal Baru
                            </button>
                        </div>`;
                    return;
                }

                const currentQ = this.questions[this.currentIdx];
                let progressBars = this.questions.map((_, i) => 
                    `<div class="h-2 w-8 rounded-full ${i < this.currentIdx ? 'bg-green-400' : i === this.currentIdx ? 'bg-blue-500' : 'bg-gray-200'}"></div>`
                ).join('');

                let optionsHTML = currentQ.options.map(opt => {
                    let btnStyle = "bg-white border-gray-200 hover:border-blue-500 hover:bg-blue-50 text-gray-700";
                    let checkIcon = "";
                    if (this.isAnswered) {
                        if (opt === currentQ.answer) {
                            btnStyle = "bg-green-100 border-green-500 text-green-800";
                            checkIcon = ICONS.check;
                        } else if (opt === this.selectedOpt) {
                            btnStyle = "bg-red-100 border-red-500 text-red-800";
                        } else {
                            btnStyle = "bg-gray-50 border-gray-200 text-gray-400 cursor-not-allowed";
                        }
                    }

                    const safeOpt = opt.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    
                    return `
                        <button ${this.isAnswered ? 'disabled' : ''} onclick="kuis.handleAnswer('${safeOpt}')" 
                                class="w-full text-left px-5 py-4 rounded-xl border-2 font-medium transition-all duration-200 flex justify-between items-center ${btnStyle}">
                            <span>${opt}</span>
                            <span>${checkIcon}</span>
                        </button>`;
                }).join('');

                let feedbackHTML = '';
                if (this.isAnswered) {
                    const isCorrect = this.selectedOpt === currentQ.answer;
                    feedbackHTML = `
                        <div class="mt-6 p-4 rounded-xl animate-fadeIn ${isCorrect ? 'bg-green-50 border border-green-200' : 'bg-orange-50 border border-orange-200'}">
                            <h4 class="font-bold mb-1 ${isCorrect ? 'text-green-800' : 'text-orange-800'}">
                                ${isCorrect ? '✅ Benar!' : '❌ Kurang Tepat!'}
                            </h4>
                            <p class="text-sm text-gray-700">${currentQ.feedback}</p>
                            <div class="mt-4 text-right">
                                <button onclick="kuis.lanjutSoal()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium shadow-sm">
                                    Selanjutnya ${ICONS.arrowRight}
                                </button>
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = `
                    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden animate-fadeIn">
                        <div class="bg-gray-50 p-4 border-b border-gray-100 flex justify-between items-center">
                            <span class="font-semibold text-gray-700">Soal ${this.currentIdx + 1} dari 5</span>
                            <div class="flex items-center gap-4">
                                <span class="text-sm font-medium text-gray-500">Skor: <span class="text-blue-600 font-bold">${this.score}</span></span>
                                <div class="flex gap-1">${progressBars}</div>
                            </div>
                        </div>
                        <div class="p-6">
                            <p class="text-gray-600 mb-4 text-sm">Perhatikan potongan kode program berikut:</p>
                            <div class="bg-blue-50 border border-blue-100 text-blue-900 p-4 rounded-lg font-mono text-sm mb-6 overflow-x-auto shadow-inner">
                                ${currentQ.code}
                            </div>
                            <h3 class="text-lg font-medium text-gray-800 mb-6">${currentQ.question}</h3>
                            <div class="space-y-3">${optionsHTML}</div>
                            ${feedbackHTML}
                        </div>
                    </div>`;
            }
        };

        const app = {
            activeTab: 'materi',
            currentSlide: 0,

            init() {
                this.renderMateri();
                simulasi.init();
                kuis.init();
                this.setTab('materi');
            },

            setTab(tabName) {
                this.activeTab = tabName;
                ['materi', 'simulasi', 'kuis'].forEach(t => {
                    const btn = document.getElementById(`btn-tab-${t}`);
                    if (t === tabName) {
                        btn.className = "flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all bg-white text-blue-700 shadow-sm";
                    } else {
                        btn.className = "flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all text-gray-500 hover:text-gray-800";
                    }
                });

                document.getElementById('section-materi').className = tabName === 'materi' ? 'block animate-fadeIn' : 'hidden';
                document.getElementById('section-simulasi').className = tabName === 'simulasi' ? 'block animate-fadeIn' : 'hidden';
                document.getElementById('section-kuis').className = tabName === 'kuis' ? 'block animate-fadeIn' : 'hidden';
            },

            nextSlide() {
                if (this.currentSlide < materiSlides.length - 1) {
                    this.currentSlide++;
                    this.renderMateri();
                }
            },
            prevSlide() {
                if (this.currentSlide > 0) {
                    this.currentSlide--;
                    this.renderMateri();
                }
            },
            
            renderMateri() {
                const container = document.getElementById('section-materi');
                const slide = materiSlides[this.currentSlide];
                
                const dots = materiSlides.map((_, idx) => 
                    `<div class="w-2 h-2 rounded-full ${idx === this.currentSlide ? 'bg-blue-600' : 'bg-gray-300'}"></div>`
                ).join('');

                container.innerHTML = `
                    <div class="max-w-3xl mx-auto">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                            <div class="bg-blue-600 p-6 text-white">
                                <h2 class="text-2xl font-bold">${slide.title}</h2>
                                <p class="text-blue-200 text-sm mt-1">Slide ${this.currentSlide + 1} dari ${materiSlides.length}</p>
                            </div>
                            <div class="p-6 min-h-[350px]">
                                ${slide.content}
                            </div>
                            <div class="p-4 bg-gray-50 border-t border-gray-100 flex justify-between items-center">
                                <button onclick="app.prevSlide()" class="flex items-center px-4 py-2 rounded-lg font-medium transition-colors ${this.currentSlide === 0 ? 'text-gray-400 cursor-not-allowed' : 'text-blue-600 hover:bg-blue-100'}" ${this.currentSlide === 0 ? 'disabled' : ''}>
                                    ${ICONS.arrowLeft} <span class="ml-2 hidden sm:inline">Sebelumnya</span>
                                </button>
                                <div class="flex gap-2">${dots}</div>
                                <button onclick="app.nextSlide()" class="flex items-center px-4 py-2 rounded-lg font-medium transition-colors ${this.currentSlide === materiSlides.length - 1 ? 'text-gray-400 cursor-not-allowed' : 'text-blue-600 hover:bg-blue-100'}" ${this.currentSlide === materiSlides.length - 1 ? 'disabled' : ''}>
                                    <span class="mr-2 hidden sm:inline">Selanjutnya</span> ${ICONS.arrowRight}
                                </button>
                            </div>
                        </div>
                    </div>`;
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
