<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papan Informasi Digital - SMAN 1 Garut</title>

  <!-- FAVICON -->
  <!--
  <link rel="shortcut icon" href="https://upload.wikimedia.org/wikipedia/id/8/8f/Logo_sman_1_garut.png" type="image/png">
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/id/8/8f/Logo_sman_1_garut.png" type="image/png">
  -->
  <link rel="shortcut icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Logo_sman_1_garut.png/960px-Logo_sman_1_garut.png" type="image/png">
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Logo_sman_1_garut.png/960px-Logo_sman_1_garut.png" type="image/png">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <!--
      <img src="https://upload.wikimedia.org/wikipedia/id/8/8f/Logo_sman_1_garut.png" 
      -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Logo_sman_1_garut.png/960px-Logo_sman_1_garut.png.png"
          alt="Logo SMAN 1 Garut" 
           id="school-logo" 
           class="logo"
           onerror="this.onerror=null; this.src='https://wsrv.nl/?url=upload.wikimedia.org/wikipedia/id/8/8f/Logo_sman_1_garut.png';">
      <div class="school-info">
        <h1 id="school-name">SMAN 1 GARUT</h1>
        <p id="school-sub">Papan Informasi Digital Resmi</p>
      </div>
    </div>
    <div class="clock-container">
      <div id="clock-time">00:00:00</div>
      <div id="clock-date">Senin, 27 Juli 2026</div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="main-container">
    
    <!-- SIDEBAR AGENDA -->
    <aside class="sidebar">
      <div class="section-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>Agenda Bulan Ini</span>
      </div>
      <div class="agenda-list" id="agenda-container">
        <div class="empty-state">Memuat data agenda...</div>
      </div>
    </aside>

    <!-- MEDIA SECTION -->
    <section class="media-section">
      <div class="media-container" id="media-container">
        <div class="empty-state">Memuat media...</div>
      </div>

      <!-- COUNTDOWN CARD -->
      <div class="countdown-card" id="countdown-card" style="display: none;">
        <span class="countdown-badge">⏳ AGENDA TERDEKAT</span>
        <div class="countdown-title" id="countdown-title">-</div>
        <div class="countdown-timer" id="countdown-timer">- Hari Lagi</div>
      </div>

      <!-- TOMBOL NAVIGASI MEDIA -->
      <div class="media-nav-buttons">
        <button class="nav-btn" id="prev-btn" onclick="prevSlide()" title="Slide Sebelumnya">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="nav-btn" id="next-btn" onclick="nextSlide()" title="Slide Selanjutnya">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <!-- MEDIA CAPTION OVERLAY -->
      <div class="media-caption" id="media-caption" style="display: none;">
        <span class="category-badge" id="media-category">INFORMASI</span>
        <h2 id="media-title">-</h2>
      </div>
    </section>

  </main>

  <!-- FOOTER RUNNING TEXT -->
  <footer class="footer">
    <div class="ticker-label">INFORMASI</div>
    <div class="ticker-wrap">
      <div class="ticker-move" id="running-text-container">
        Memuat informasi pengumuman sekolah...
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
