<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Gerbang Ujian Google Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for text area */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span class="font-bold text-xl tracking-tight">CBT Form Generator</span>
                </div>
                <div>
                    <span class="text-sm font-medium bg-blue-700 px-3 py-1 rounded-full">Versi PC/Desktop</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-7xl">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- Kolom Kiri: Form Input -->
            <div class="bg-white rounded-xl shadow-md p-6 border border-gray-100">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-2 mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Pengaturan Ujian</h2>
                    <div class="flex space-x-2 mt-2 sm:mt-0">
                        <button onclick="exportConfig()" class="text-xs flex items-center space-x-1 bg-green-100 hover:bg-green-200 text-green-700 py-1.5 px-3 rounded shadow-sm transition font-semibold" title="Simpan pengaturan ke file JSON">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            <span>Export Config</span>
                        </button>
                        <button onclick="document.getElementById('importFile').click()" class="text-xs flex items-center space-x-1 bg-purple-100 hover:bg-purple-200 text-purple-700 py-1.5 px-3 rounded shadow-sm transition font-semibold" title="Muat pengaturan dari file JSON">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            <span>Import Config</span>
                        </button>
                        <input type="file" id="importFile" class="hidden" accept=".json" onchange="importConfig(event)">
                    </div>
                </div>
                
                <div class="space-y-5">
                    <div>
                        <label for="examTitle" class="block text-sm font-semibold text-gray-700 mb-1">Judul Ujian</label>
                        <input type="text" id="examTitle" placeholder="Contoh: Penilaian Akhir Semester Ganjil" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" value="Ujian Online Sekolah">
                    </div>

                    <!-- MAPEL DINAMIS SECTION -->
                    <div class="pt-4 border-t">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="text-lg font-semibold text-gray-800">Daftar Mata Pelajaran & Karantina</h3>
                            <button onclick="addSubject()" class="text-sm bg-blue-100 hover:bg-blue-200 text-blue-700 py-1.5 px-3 rounded-md font-medium transition shadow-sm flex items-center space-x-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                <span>Tambah Mapel</span>
                            </button>
                        </div>
                        <div id="subjectsContainer" class="space-y-4 max-h-[450px] overflow-y-auto pr-2 pb-2">
                            <!-- Dynamic subject items will be injected here -->
                        </div>
                    </div>

                    <div class="pt-4 border-t">
                        <h3 class="text-lg font-semibold mb-3 text-gray-800">Fitur Keamanan (Anti-Curang)</h3>
                        
                        <label class="flex items-start space-x-3 cursor-pointer p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition border border-gray-200">
                            <div class="flex items-center h-5">
                                <input id="featAntiTab" type="checkbox" checked class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            </div>
                            <div class="flex flex-col">
                                <span class="text-sm font-semibold text-gray-800">Fitur 1: Deteksi Pindah Tab & Keluar Layar</span>
                                <span class="text-xs text-gray-500">Mengunci ke layar penuh dan memunculkan peringatan jika siswa membuka tab lain atau meminimalkan browser.</span>
                            </div>
                        </label>

                        <label class="flex items-start space-x-3 cursor-pointer p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition border border-gray-200 mt-3">
                            <div class="flex items-center h-5">
                                <input id="featAntiRightClick" type="checkbox" checked class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            </div>
                            <div class="flex flex-col">
                                <span class="text-sm font-semibold text-gray-800">Fitur 2: Blokir Klik Kanan & Copy-Paste</span>
                                <span class="text-xs text-gray-500">Mencegah siswa melakukan Inspect Element (F12) dan menyalin teks (Ctrl+C, Ctrl+V).</span>
                            </div>
                        </label>

                        <label class="flex items-start space-x-3 cursor-pointer p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition border border-gray-200 mt-3">
                            <div class="flex items-center h-5">
                                <input id="featAntiSplit" type="checkbox" checked class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            </div>
                            <div class="flex flex-col">
                                <span class="text-sm font-semibold text-gray-800">Fitur 3: Anti Split-Screen & Resizing</span>
                                <span class="text-xs text-gray-500">Mendeteksi jika tinggi layar mengecil drastis (membuka aplikasi melayang/layar belah).</span>
                            </div>
                        </label>

                        <label class="flex items-start space-x-3 cursor-pointer p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition border border-gray-200 mt-3">
                            <div class="flex items-center h-5">
                                <input id="featAntiDevTools" type="checkbox" checked class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            </div>
                            <div class="flex flex-col">
                                <span class="text-sm font-semibold text-gray-800">Fitur 4: Anti Developer Tools & Inspect</span>
                                <span class="text-xs text-gray-500">Membekukan layar & mencatat pelanggaran jika siswa memaksa membuka Inspect Element (F12).</span>
                            </div>
                        </label>

                        <label class="flex items-start space-x-3 cursor-pointer p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition border border-gray-200 mt-3">
                            <div class="flex items-center h-5">
                                <input id="featAntiNav" type="checkbox" checked class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            </div>
                            <div class="flex flex-col">
                                <span class="text-sm font-semibold text-gray-800">Fitur 5: Cegah Tombol Back & Refresh</span>
                                <span class="text-xs text-gray-500">Memblokir tombol kembali (back) dan memunculkan peringatan saat mencoba refresh/tutup tab.</span>
                            </div>
                        </label>

                        <label class="flex items-start space-x-3 cursor-pointer p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition border border-gray-200 mt-3 border-l-4 border-l-red-500">
                            <div class="flex items-center h-5">
                                <input id="featTimeout" type="checkbox" checked class="w-5 h-5 text-red-600 border-gray-300 rounded focus:ring-red-500">
                            </div>
                            <div class="flex flex-col">
                                <span class="text-sm font-semibold text-gray-800">Fitur 6: Timer & Paksa Submit (Timeout)</span>
                                <span class="text-xs text-gray-500">Hitung mundur durasi. Jika habis, layar ditimpa peringatan kedip untuk memaksa submit.</span>
                            </div>
                        </label>
                    </div>

                    <div class="pt-6">
                        <button onclick="generateCode()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-200 flex justify-center items-center space-x-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                            <span>Generate File Ujian</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Kolom Kanan: Hasil Generate -->
            <div class="bg-white rounded-xl shadow-md flex flex-col border border-gray-100 h-[600px] lg:h-auto">
                <div class="flex justify-between items-center p-4 border-b bg-gray-50 rounded-t-xl">
                    <h2 class="text-lg font-bold text-gray-800">Hasil Kode HTML</h2>
                    <div class="flex space-x-2">
                        <button onclick="copyToClipboard()" class="flex items-center space-x-1 text-sm bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 py-1.5 px-3 rounded-md transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            <span>Copy</span>
                        </button>
                        <button onclick="downloadCode()" class="flex items-center space-x-1 text-sm bg-green-600 hover:bg-green-700 text-white py-1.5 px-3 rounded-md shadow transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            <span>Download .html</span>
                        </button>
                    </div>
                </div>
                <div class="flex-grow p-0 relative">
                    <textarea id="outputCode" class="w-full h-full p-4 bg-gray-900 text-green-400 font-mono text-sm resize-none outline-none" readonly></textarea>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-800 text-white px-4 py-3 rounded-lg shadow-lg flex items-center space-x-3 z-50 pointer-events-none">
        <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="toastMessage" class="font-medium">Berhasil!</span>
    </div>

    <script>
        let subjectCount = 0;

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); }, 3000);
        }

        // --- FITUR AUTO SAVE & EXPORT/IMPORT ---
        function getFormData() {
            const subjects = [];
            document.querySelectorAll('.subject-item').forEach((el) => {
                subjects.push({
                    name: el.querySelector('.subj-name').value,
                    url: el.querySelector('.subj-url').value,
                    start: el.querySelector('.subj-start').value,
                    end: el.querySelector('.subj-end').value,
                    duration: el.querySelector('.subj-duration').value,
                    maxV: el.querySelector('.subj-max').value,
                    passcode: el.querySelector('.subj-passcode').value,
                    pin: el.querySelector('.subj-pin').value
                });
            });
            return {
                title: document.getElementById('examTitle').value,
                features: {
                    featAntiTab: document.getElementById('featAntiTab').checked,
                    featAntiRightClick: document.getElementById('featAntiRightClick').checked,
                    featAntiSplit: document.getElementById('featAntiSplit').checked,
                    featAntiDevTools: document.getElementById('featAntiDevTools').checked,
                    featAntiNav: document.getElementById('featAntiNav').checked,
                    featTimeout: document.getElementById('featTimeout').checked
                },
                subjects: subjects
            };
        }

        function applyFormData(data) {
            if (!data) return;
            if (data.title) document.getElementById('examTitle').value = data.title;
            if (data.features) {
                if (data.features.featAntiTab !== undefined) document.getElementById('featAntiTab').checked = data.features.featAntiTab;
                if (data.features.featAntiRightClick !== undefined) document.getElementById('featAntiRightClick').checked = data.features.featAntiRightClick;
                if (data.features.featAntiSplit !== undefined) document.getElementById('featAntiSplit').checked = data.features.featAntiSplit;
                if (data.features.featAntiDevTools !== undefined) document.getElementById('featAntiDevTools').checked = data.features.featAntiDevTools;
                if (data.features.featAntiNav !== undefined) document.getElementById('featAntiNav').checked = data.features.featAntiNav;
                if (data.features.featTimeout !== undefined) document.getElementById('featTimeout').checked = data.features.featTimeout;
            }
            if (data.subjects && data.subjects.length > 0) {
                document.getElementById('subjectsContainer').innerHTML = '';
                subjectCount = 0;
                data.subjects.forEach(subj => addSubject(subj));
            }
        }

        function exportConfig() {
            const dataStr = JSON.stringify(getFormData(), null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "config_cbt_ujian.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("Konfigurasi berhasil diexport!");
        }

        function importConfig(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    applyFormData(data);
                    showToast("Konfigurasi berhasil dimuat!");
                } catch (err) {
                    alert("Format File JSON tidak valid!");
                }
                event.target.value = ''; 
            };
            reader.readAsText(file);
        }

        // Timer penyimpan otomatis ke localStorage setiap 3 detik
        setInterval(() => {
            const data = getFormData();
            localStorage.setItem('cbt_draft', JSON.stringify(data));
        }, 3000);


        function addSubject(data = null) {
            subjectCount++;
            const id = subjectCount;
            const div = document.createElement('div');
            div.className = 'p-4 bg-gray-50 border border-gray-200 rounded-lg relative subject-item shadow-sm';
            
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            const localStart = new Date(now.getTime() - offset);
            const startStr = localStart.toISOString().slice(0,16);
            const localEnd = new Date(now.getTime() - offset + (2 * 60 * 60 * 1000));
            const endStr = localEnd.toISOString().slice(0,16);

            div.innerHTML = `
                <button onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-red-500 hover:text-red-700 bg-red-100 hover:bg-red-200 rounded-full w-7 h-7 flex items-center justify-center font-bold text-xs transition" title="Hapus Mapel">✕</button>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-2">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Mata Pelajaran</label>
                        <input type="text" class="subj-name w-full px-3 py-2 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none text-sm" placeholder="Contoh: Matematika" value="${data ? data.name : 'Mata Pelajaran ' + id}">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Link Ujian (Google Form)</label>
                        <input type="url" class="subj-url w-full px-3 py-2 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none text-sm" placeholder="https://docs.google.com/forms/..." value="${data ? data.url : 'https://docs.google.com/forms/d/e/1FAIpQLSeH2JtS0wM9yYtI_G8431H12j12345/viewform'}">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Waktu Mulai Akses</label>
                        <input type="datetime-local" class="subj-start w-full px-3 py-2 border border-gray-300 rounded outline-none text-sm" value="${data ? data.start : startStr}">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Waktu Selesai Akses</label>
                        <input type="datetime-local" class="subj-end w-full px-3 py-2 border border-gray-300 rounded outline-none text-sm" value="${data ? data.end : endStr}">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Durasi (Menit)</label>
                        <input type="number" class="subj-duration w-full px-3 py-2 border border-gray-300 rounded outline-none text-sm" placeholder="90" value="${data ? data.duration : '90'}">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Maks Pelanggaran</label>
                        <input type="number" class="subj-max w-full px-3 py-2 border border-gray-300 rounded outline-none text-sm" placeholder="3" value="${data ? data.maxV : '3'}">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Passcode Siswa</label>
                        <input type="text" class="subj-passcode w-full px-3 py-2 border border-gray-300 rounded outline-none text-sm font-mono tracking-widest bg-blue-50" placeholder="Kosongkan jika bebas" value="${data ? data.passcode : ''}">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">PIN Pengawas (Buka Blokir)</label>
                        <input type="text" class="subj-pin w-full px-3 py-2 border border-gray-300 rounded outline-none text-sm font-mono tracking-widest bg-yellow-50" placeholder="Contoh: 123456" value="${data ? data.pin : '123456'}">
                    </div>
                </div>
            `;
            document.getElementById('subjectsContainer').appendChild(div);
        }

        // --- FUNGSI OBFUSCATOR KUSTOM ---
        function obfuscateCustomScript(code) {
            const b64 = btoa(unescape(encodeURIComponent(code)));
            let shifted = "";
            for(let i=0; i<b64.length; i++) {
                shifted += String.fromCharCode(b64.charCodeAt(i) + 2); // Shift ASCII 2 langkah
            }
            return `
        // [CBT Engine - Encrypted & Obfuscated]
        (function(){
            var d="${shifted}";
            var r="";
            for(var i=0;i<d.length;i++) r+=String.fromCharCode(d.charCodeAt(i)-2);
            var s=document.createElement('script');
            s.type='text/javascript';
            s.innerHTML=decodeURIComponent(escape(atob(r)));
            document.head.appendChild(s);
        })();`;
        }

        function generateCode() {
            const title = document.getElementById('examTitle').value || "Ujian Online";
            const useAntiTab = document.getElementById('featAntiTab').checked;
            const useAntiRightClick = document.getElementById('featAntiRightClick').checked;
            const useAntiSplit = document.getElementById('featAntiSplit').checked;
            const useAntiDevTools = document.getElementById('featAntiDevTools').checked;
            const useAntiNav = document.getElementById('featAntiNav').checked;
            const useTimeout = document.getElementById('featTimeout').checked;

            const subjects = [];
            document.querySelectorAll('.subject-item').forEach((el, index) => {
                let url = el.querySelector('.subj-url').value;
                if(url.includes('?')) url = url.split('?')[0]; 
                url += "?embedded=true";
                
                subjects.push({
                    id: 'subj_' + index + '_' + Date.now().toString().slice(-4),
                    name: el.querySelector('.subj-name').value,
                    url: url,
                    start: el.querySelector('.subj-start').value,
                    end: el.querySelector('.subj-end').value,
                    duration: parseInt(el.querySelector('.subj-duration').value) || 90,
                    maxV: parseInt(el.querySelector('.subj-max').value) || 3,
                    passcode: el.querySelector('.subj-passcode').value,
                    pin: el.querySelector('.subj-pin').value || '1234'
                });
            });

            if(subjects.length === 0) {
                showToast("Harap tambahkan minimal 1 Mata Pelajaran!");
                return;
            }

            const jsonStr = JSON.stringify(subjects);
            const encodedUri = encodeURIComponent(jsonStr);
            let encrypted = "";
            for(let i=0; i<encodedUri.length; i++) encrypted += String.fromCharCode(encodedUri.charCodeAt(i) + 5);
            const encryptedBase64 = btoa(encrypted);

            // Menyusun seluruh Skrip Pengaman Ujian yang akan di-obfuscate
            const rawScriptCode = `
        const encData = "${encryptedBase64}";
        const decRaw = atob(encData);
        let shiftedStr = "";
        for(let i=0; i<decRaw.length; i++) {
            shiftedStr += String.fromCharCode(decRaw.charCodeAt(i) - 5);
        }
        const mapelList = JSON.parse(decodeURIComponent(shiftedStr));
        
        let currentSubject = null;
        let timerInterval = null;
        let durasiDetik = 0;
        let isForceSubmitting = false;
        let gracePeriod = 30;
        
        let isExamActive = false;
        let isLocked = false;
        let timeOffset = 0; // Waktu sinkronisasi server

        function getNow() {
            return Date.now() + timeOffset; // Gabungan waktu lokal + selisih server API
        }

        window.renderLobby = function() {
            const select = document.getElementById('mapel-select');
            mapelList.forEach(m => {
                let opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.name;
                select.appendChild(opt);
            });
            setInterval(checkSelection, 1000);
        }

        window.checkSelection = function() {
            const select = document.getElementById('mapel-select');
            const passcode = document.getElementById('student-passcode');
            const btn = document.getElementById('btn-mulai');
            const info = document.getElementById('schedule-info');
            const status = document.getElementById('status-message');
            
            if(!select.value) {
                passcode.disabled = true; passcode.value = ""; btn.disabled = true;
                info.style.display = 'none'; status.style.display = 'none'; currentSubject = null;
                return;
            }

            const m = mapelList.find(x => x.id === select.value);
            currentSubject = m; 

            const now = getNow(); 
            const startT = new Date(m.start).getTime();
            const endT = new Date(m.end).getTime();

            info.style.display = 'block';
